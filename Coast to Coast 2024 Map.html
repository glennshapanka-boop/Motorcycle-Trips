const map = L.map('map', { zoomControl: true }).setView([33, -98], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const dayTrackLayers = {};   // day -> L.layerGroup (polylines)
const dayPhotoLayers = {};   // day -> L.layerGroup (markers + leader lines)
let allBounds = null;
let photosVisible = true;
const dayEnabled = {};

function fmtDuration(min) {
  if (!min) return "n/a";
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return (h > 0 ? h + "h " : "") + m + "m";
}
function fmtTime(iso) {
  if (!iso) return "n/a";
  return iso.replace("T", " ").replace("Z", " UTC");
}
function fmtPhotoTime(dt) {
  // "2024:04:20 14:59:03" -> "Apr 20, 2:59 PM"
  if (!dt) return "";
  const [datePart, timePart] = dt.split(" ");
  const [y, mo, da] = datePart.split(":").map(Number);
  const [h, mi] = timePart.split(":").map(Number);
  const d = new Date(y, mo - 1, da, h, mi);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " +
         d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

DATA.days.forEach(d => {
  dayTrackLayers[d.day] = L.layerGroup();
  dayPhotoLayers[d.day] = L.layerGroup();
  dayEnabled[d.day] = true;
});

// ---- Tracks ----
DATA.tracks.forEach(t => {
  const latlngs = t.coords.map(c => [c[0], c[1]]);
  const poly = L.polyline(latlngs, {
    color: t.color,
    weight: 4,
    opacity: 0.85,
    lineJoin: 'round'
  });
  const popupHtml = `
    <div class="popup-title">${t.label}</div>
    <div class="popup-row"><b>Day ${t.day}</b> &middot; ${t.date}</div>
    <div class="popup-row">Distance: ${t.distance_mi} mi</div>
    <div class="popup-row">Duration: ${fmtDuration(t.duration_min)}</div>
    <div class="popup-row">Start: ${fmtTime(t.start_time)}</div>
    <div class="popup-row">End: ${fmtTime(t.end_time)}</div>
    <div class="popup-row" style="color:#999;font-size:11px;">${t.file}</div>
  `;
  poly.bindPopup(popupHtml);
  poly.on('mouseover', function() { this.setStyle({ weight: 7, opacity: 1 }); });
  poly.on('mouseout', function() { this.setStyle({ weight: 4, opacity: 0.85 }); });
  poly.addTo(dayTrackLayers[t.day]);

  const b = poly.getBounds();
  if (!allBounds) allBounds = L.latLngBounds(b.getSouthWest(), b.getNorthEast());
  else allBounds.extend(b);
});

// ---- Photos (with leader lines for decluttering close-together shots) ----
const photosChrono = DATA.photos.slice().sort((a, b) => (a.datetime || "").localeCompare(b.datetime || ""));

photosChrono.forEach((p, idx) => {
  p._idx = idx;
  const group = dayPhotoLayers[p.day];
  if (!group) return;

  if (p.has_leader) {
    L.polyline([[p.true_lat, p.true_lon], [p.lat, p.lon]], {
      color: '#555',
      weight: 1.5,
      opacity: 0.75,
      dashArray: '3,4'
    }).addTo(group);
    L.circleMarker([p.true_lat, p.true_lon], {
      radius: 3, color: '#333', fillColor: '#fff', fillOpacity: 1, weight: 1.5
    }).addTo(group);
  }

  const icon = L.divIcon({
    className: '',
    html: `<div class="photo-marker" style="background-image:url('${p.thumb}'); border-color:${p.color};"></div>`,
    iconSize: [46, 46],
    iconAnchor: [23, 23]
  });
  const marker = L.marker([p.lat, p.lon], { icon: icon, riseOnHover: true });

  const popupDiv = document.createElement('div');
  popupDiv.innerHTML = `
    <img class="photo-popup-img" src="${p.full}" data-idx="${idx}">
    <div class="photo-popup-place">${p.place || ''}</div>
    <div class="photo-popup-cap">Day ${p.day} &middot; ${fmtPhotoTime(p.datetime)}${p.interpolated ? ' <span title="Location estimated from nearby GPS track (photo had no GPS tag)">~</span>' : ''}</div>
  `;
  popupDiv.querySelector('img').addEventListener('click', (e) => openLightbox(Number(e.target.dataset.idx)));
  marker.bindPopup(popupDiv);
  if (p.place) {
    marker.bindTooltip(p.place, { permanent: true, direction: 'bottom', offset: [0, 16], className: 'photo-label', opacity: 0.95 });
  }
  marker.addTo(group);
});

Object.values(dayTrackLayers).forEach(l => l.addTo(map));
Object.values(dayPhotoLayers).forEach(l => l.addTo(map));

if (allBounds) map.fitBounds(allBounds.pad(0.05));

// hide the small permanent place-name labels when zoomed out over the whole route
// (30 labels at continental scale is unreadable clutter); they reappear once you zoom into a day.
const LABEL_ZOOM_THRESHOLD = 8;
function updateLabelVisibility() {
  const el = map.getContainer();
  if (map.getZoom() < LABEL_ZOOM_THRESHOLD) el.classList.add('hide-photo-labels');
  else el.classList.remove('hide-photo-labels');
}
map.on('zoomend', updateLabelVisibility);
updateLabelVisibility();

// trip start/end markers
const firstTrack = DATA.tracks[0];
const lastTrack = DATA.tracks[DATA.tracks.length - 1];
L.circleMarker(firstTrack.coords[0], {
  radius: 8, className: 'start-icon', color: '#1a8f2f', fillColor: '#2ecc40', fillOpacity: 1, weight: 2
}).bindPopup(`<b>Trip Start</b><br>${firstTrack.date}<br>${firstTrack.label}`).addTo(map);

L.circleMarker(lastTrack.coords[lastTrack.coords.length - 1], {
  radius: 8, className: 'end-icon', color: '#a30000', fillColor: '#e74c3c', fillOpacity: 1, weight: 2
}).bindPopup(`<b>Trip End</b><br>${lastTrack.date}<br>${lastTrack.label}`).addTo(map);

// ---- Layer visibility logic ----
function refreshDayLayer(day) {
  const showTracks = dayEnabled[day];
  const showPhotos = dayEnabled[day] && photosVisible;
  if (showTracks) map.addLayer(dayTrackLayers[day]); else map.removeLayer(dayTrackLayers[day]);
  if (showPhotos) map.addLayer(dayPhotoLayers[day]); else map.removeLayer(dayPhotoLayers[day]);
}

// ---- Sidebar ----
const dayListEl = document.getElementById('day-list');

DATA.days.forEach(d => {
  const item = document.createElement('div');
  item.className = 'day-item';

  const header = document.createElement('div');
  header.className = 'day-header';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'day-checkbox';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    dayEnabled[d.day] = cb.checked;
    refreshDayLayer(d.day);
  });

  const swatch = document.createElement('div');
  swatch.className = 'day-swatch';
  swatch.style.background = d.color;

  const titleWrap = document.createElement('div');
  titleWrap.style.flex = '1';
  const dateObj = new Date(d.date + 'T12:00:00Z');
  const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const photoBit = d.num_photos ? ` &middot; ${d.num_photos} photo${d.num_photos > 1 ? 's' : ''}` : '';
  titleWrap.innerHTML = `<div class="day-title">Day ${d.day} &middot; ${dateStr}</div>
    <div class="day-meta">${d.distance_mi} mi &middot; ${d.num_legs} track${d.num_legs > 1 ? 's' : ''}${photoBit}</div>`;

  header.appendChild(cb);
  header.appendChild(swatch);
  header.appendChild(titleWrap);

  header.addEventListener('click', (e) => {
    if (e.target === cb) return;
    item.classList.toggle('expanded');
  });

  const legList = document.createElement('div');
  legList.className = 'leg-list';

  const dayTracks = DATA.tracks.filter(t => t.day === d.day);
  dayTracks.forEach(t => {
    const legEl = document.createElement('div');
    legEl.className = 'leg-item';
    legEl.innerHTML = `${t.label} <span class="leg-dist">${t.distance_mi} mi</span>`;
    legEl.addEventListener('click', () => {
      const latlngs = t.coords.map(c => [c[0], c[1]]);
      map.fitBounds(L.polyline(latlngs).getBounds().pad(0.15));
    });
    legList.appendChild(legEl);
  });

  item.appendChild(header);
  item.appendChild(legList);
  dayListEl.appendChild(item);
});

document.getElementById('btn-show-all').addEventListener('click', () => {
  document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = true);
  DATA.days.forEach(d => { dayEnabled[d.day] = true; refreshDayLayer(d.day); });
});
document.getElementById('btn-hide-all').addEventListener('click', () => {
  document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
  DATA.days.forEach(d => { dayEnabled[d.day] = false; refreshDayLayer(d.day); });
});
document.getElementById('btn-fit').addEventListener('click', () => {
  if (allBounds) map.fitBounds(allBounds.pad(0.05));
});
const btnPhotos = document.getElementById('btn-photos');
btnPhotos.addEventListener('click', () => {
  photosVisible = !photosVisible;
  btnPhotos.classList.toggle('active', photosVisible);
  DATA.days.forEach(d => refreshDayLayer(d.day));
});

// ---- Sidebar collapse ----
const sidebarEl = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebar-toggle');
sidebarToggle.addEventListener('click', () => {
  sidebarEl.classList.toggle('collapsed');
  sidebarToggle.innerHTML = sidebarEl.classList.contains('collapsed') ? '&#8250;' : '&#8249;';
  setTimeout(() => map.invalidateSize(), 260);
});

// ---- Lightbox ----
const lightboxEl = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCaption = document.getElementById('lb-caption');
let lbIdx = 0;

function openLightbox(idx) {
  lbIdx = idx;
  showLightboxPhoto();
  lightboxEl.classList.add('open');
}
function showLightboxPhoto() {
  const p = photosChrono[lbIdx];
  lbImg.src = p.full;
  const placeBit = p.place ? `${p.place} — ` : '';
  lbCaption.textContent = `${placeBit}Day ${p.day} · ${fmtPhotoTime(p.datetime)}` + (p.interpolated ? ' (location estimated)' : '');
}
function closeLightbox() { lightboxEl.classList.remove('open'); }
document.querySelector('.lb-close').addEventListener('click', closeLightbox);
document.querySelector('.lb-prev').addEventListener('click', () => { lbIdx = (lbIdx - 1 + photosChrono.length) % photosChrono.length; showLightboxPhoto(); });
document.querySelector('.lb-next').addEventListener('click', () => { lbIdx = (lbIdx + 1) % photosChrono.length; showLightboxPhoto(); });
lightboxEl.addEventListener('click', (e) => { if (e.target === lightboxEl) closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (!lightboxEl.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') { lbIdx = (lbIdx - 1 + photosChrono.length) % photosChrono.length; showLightboxPhoto(); }
  if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % photosChrono.length; showLightboxPhoto(); }
});
</script>
</body>
